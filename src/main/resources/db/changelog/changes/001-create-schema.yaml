databaseChangeLog:
  - changeSet:
      id: 001-create-departments
      author: senla
      changes:
        - createTable:
            tableName: departments
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: code
                  type: varchar(10)
        - addUniqueConstraint:
            tableName: departments
            columnNames: code
            constraintName: uk_departments_code

  - changeSet:
      id: 002-create-employees
      author: senla
      changes:
        - createTable:
            tableName: employees
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: full_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(255)
              - column:
                  name: position
                  type: varchar(255)
              - column:
                  name: department_id
                  type: bigint
              - column:
                  name: hire_date
                  type: date
        - addUniqueConstraint:
            tableName: employees
            columnNames: email
            constraintName: uk_employees_email
        - addForeignKeyConstraint:
            baseTableName: employees
            baseColumnNames: department_id
            referencedTableName: departments
            referencedColumnNames: id
            constraintName: fk_employees_department

  - changeSet:
      id: 003-create-travel-requests
      author: senla
      changes:
        - createTable:
            tableName: travel_requests
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: employee_id
                  type: bigint
              - column:
                  name: department_id
                  type: bigint
              - column:
                  name: destination
                  type: varchar(255)
              - column:
                  name: start_date
                  type: date
              - column:
                  name: end_date
                  type: date
              - column:
                  name: purpose
                  type: varchar(500)
              - column:
                  name: status
                  type: varchar(255)
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: estimated_cost
                  type: numeric(38, 2)
        - addForeignKeyConstraint:
            baseTableName: travel_requests
            baseColumnNames: employee_id
            referencedTableName: employees
            referencedColumnNames: id
            constraintName: fk_travel_requests_employee
        - addForeignKeyConstraint:
            baseTableName: travel_requests
            baseColumnNames: department_id
            referencedTableName: departments
            referencedColumnNames: id
            constraintName: fk_travel_requests_department

  - changeSet:
      id: 004-create-request-history
      author: senla
      changes:
        - createTable:
            tableName: request_history
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: travel_request_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: old_status
                  type: varchar(255)
              - column:
                  name: new_status
                  type: varchar(255)
              - column:
                  name: changed_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: comment
                  type: varchar(255)
        - addForeignKeyConstraint:
            baseTableName: request_history
            baseColumnNames: travel_request_id
            referencedTableName: travel_requests
            referencedColumnNames: id
            constraintName: fk_request_history_travel_request
