databaseChangeLog:
  - changeSet:
      id: 006-fix-test-data-sequences
      author: senla
      context: "@test"
      changes:
        - sql:
            sql: "SELECT setval(pg_get_serial_sequence('departments', 'id'), COALESCE((SELECT MAX(id) FROM departments), 1), EXISTS (SELECT 1 FROM departments))"
        - sql:
            sql: "SELECT setval(pg_get_serial_sequence('employees', 'id'), COALESCE((SELECT MAX(id) FROM employees), 1), EXISTS (SELECT 1 FROM employees))"
        - sql:
            sql: "SELECT setval(pg_get_serial_sequence('travel_requests', 'id'), COALESCE((SELECT MAX(id) FROM travel_requests), 1), EXISTS (SELECT 1 FROM travel_requests))"
        - sql:
            sql: "SELECT setval(pg_get_serial_sequence('request_history', 'id'), COALESCE((SELECT MAX(id) FROM request_history), 1), EXISTS (SELECT 1 FROM request_history))"

  - changeSet:
      id: 007-require-department-code-and-employee-email
      author: senla
      preConditions:
        - onFail: HALT
        - onError: HALT
        - sqlCheck:
            expectedResult: "0"
            sql: SELECT COUNT(*) FROM departments WHERE code IS NULL
        - sqlCheck:
            expectedResult: "0"
            sql: SELECT COUNT(*) FROM employees WHERE email IS NULL
      changes:
        - addNotNullConstraint:
            tableName: departments
            columnName: code
            columnDataType: varchar(10)
        - addNotNullConstraint:
            tableName: employees
            columnName: email
            columnDataType: varchar(255)
