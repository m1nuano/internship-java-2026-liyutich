spring:
  application:
    name: senla
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/travel_request_system}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  cloud:
    openfeign:
      client:
        config:
          notification-service:
            connectTimeout: 1000
            readTimeout: 3000

notification-service:
  enabled: true
  url: ${NOTIFICATION_SERVICE_URL:http://localhost:8081}

service-logging:
  enabled: true
  level: INFO

logging:
  level:
    com.demo.logging: ${service-logging.level:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Travel request service
