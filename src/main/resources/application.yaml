spring:
  application:
    name: senla
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/travel_request_system}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
